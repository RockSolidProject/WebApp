name: Publish images to Docker Hub

on:
  push:
    branches:
      - "develop"
      - '**'
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Backend Docker image
        run: docker build ./backend -t urban888/rocksolid-api:latest

      - name: Push Backend Docker image to Docker Hub
        run: docker push urban888/rocksolid-api:latest

      - name: Build Frontend Docker image
        run: docker build ./frontend -t urban888/rocksolid-frontend:latest

      - name: Push Frontend Docker image to Docker Hub
        run: docker push urban888/rocksolid-frontend:latest

      - name: Trigger redeploy webhook
        if: success()
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          BODY='{}'
          SIGNATURE=$(echo -n $BODY | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            --data "$BODY" \
            http://52.166.14.239:3000/webhook
