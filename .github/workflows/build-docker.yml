name: Publish images to Docker Hub

on:
  push:
    branches:
      - "develop"
      - '**'
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Backend Docker image
        run: docker build ./backend -t urban888/rocksolid-api:latest

      - name: Push Backend Docker image to Docker Hub
        run: docker push urban888/rocksolid-api:latest

      - name: Build Frontend Docker image
        run: docker build ./frontend -t urban888/rocksolid-frontend:latest

      - name: Push Frontend Docker image to Docker Hub
        run: docker push urban888/rocksolid-frontend:latest

      - name: Trigger webhook with curl
        run: |
          curl -X POST ${{ secrets.DEPLOY_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.WEBHOOK_SECRET }}" \
          -d '{"event":"deploy","project":"mern-app"}'